<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BilanzAnalyser - main</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <link rel="icon" type="image/png" th:href="@{/favicon-96x96.png}" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="shortcut icon" th:href="@{/favicon.ico}" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}" />
    <meta name="apple-mobile-web-app-title" content="BilanzAnalyser" />
    <link rel="manifest" th:href="@{/site.webmanifest}" />
</head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a th:href="@{/}" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="32" class="me-2" viewBox="0 0 118 94"
                     role="img"><title>Bootstrap</title>
                    <path fill-rule="evenodd" clip-rule="evenodd"

                          fill="currentColor"></path>
                </svg>
                <span class="fs-4">Welcome to BilanzAnalyser!</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">Datei hochladen</h1>
                <p class="col-md-8 fs-4">Lade eine passende OpenOffice Spreadsheet (ODS)-Datei hoch, um mit der Analyse
                    zu starten.</p>
                <a th:href="@{/upload}">
                    <button class="btn btn-primary btn-lg" type="button">Upload</button>
                </a>
            </div>
        </div>

        <div class="row align-items-md-stretch">
            <div class="col-md-6">
                <div class="h-100 p-5 text-bg-dark rounded-3">
                    <h3 class="mb-3">Derzeit bekannte Daten</h3>
                    <ul id="dataItemList"></ul>
                    <button class="btn btn-outline-secondary" type="button" onclick="loadDataItems()">Nachladen</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="h-100 p-5 bg-body-tertiary border rounded-3">
                    <h2>Analyse</h2>
                    <p>Um die Daten zu wälzen, bietet sich der Analysebereich an.</p>
                    <a th:href="@{/analyse}">
                        <button class="btn btn-outline-secondary" type="button">Analyse starten</button>
                    </a>
                    <div id="mainChart" style="width: 600px;height:400px;"></div>
                </div>
            </div>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            &copy; <span th:text="${T(java.time.Year).now()}"></span> <a href="https://www.aiki-it.de" target="_blank">AIKI IT</a>
        </footer>
    </div>
</main>
<script th:src="@{/js/echarts/echarts.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/axios/axios.min.js}"></script>
<script>
    async function loadDataItems() {
        try {
            const response = await axios.get('/api/dataitems');
            const data = response.data;

            const list = document.getElementById('dataItemList');
            list.innerHTML = '';

            data.forEach(item => {
                const key = item.name;
                const value = item.value;
                const li = document.createElement('li');
                li.textContent = key + ": " + value;

                list.appendChild(li);
            });

        } catch (error) {
            console.error('Error loading data items:', error);
        }
    }

    window.onload = loadDataItems;

    // load graph
    axios.get("/api/dataitems")
        .then(response => {
            const data = response.data;

            const products = data.map(item => item.name);
            const amounts = data.map(item => item.amount);

            const chart = echarts.init(document.getElementById('mainChart'));

            let option;
            option = {
                tooltip: {
                    trigger: 'item'
                },
                legend: {
                    top: '5%',
                    left: 'center'
                },
                series: [
                    {
                        name: 'Database entries',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['50%', '70%'],
                        // adjust the start and end angle
                        startAngle: 180,
                        endAngle: 360,
                        data: data
                    }
                ]
            };

            option && chart.setOption(option);
        })
        .catch(error => {
            console.error("Error loading data for graph:", error);
        });

    // load graph

</body>
</html>
