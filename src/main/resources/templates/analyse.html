<!DOCTYPE>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/icons/bootstrap-icons.min.css}" rel="stylesheet">
    <script th:src="@{/js/echarts/echarts.min.js}"></script>
    <title>Analyse</title>
</head>
<body>
<div class="container mt-0">
    <h2>Analyse database contents</h2>

    <div class="container mt-5">
        <h2 class="mb-4">Resultate</h2>

        <div id="mainChart" style="width: 600px;height:400px;"></div>

        <script type="text/javascript">
            var chartDom = document.getElementById('mainChart');
            var myChart = echarts.init(chartDom);
            var option;

            option = {
                title: {
                    text: 'ECharts Example'
                },
                tooltip: {},
                legend: {
                    data: ['sales']
                },
                xAxis: {
                    data: ['Shirts', 'Cardigans', 'Chiffons', 'Pants', 'Heels', 'Socks']
                },
                yAxis: {},
                series: [
                    {
                        name: 'sales',
                        type: 'bar',
                        data: [5, 20, 36, 10, 10, 20]
                    }
                ]
            };

            option && myChart.setOption(option);
        </script>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
