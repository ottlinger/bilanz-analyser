<!DOCTYPE>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/icons/bootstrap-icons.min.css}" rel="stylesheet">
    <title>Datei hochladen</title>
</head>
<body>
<div class="container mt-0">
    <h2>Upload ODS-Bilanz</h2>
    <div th:if="${message != null}" class="p-4 alert alert-danger" role="alert">
        <i class="bi bi-bug"></i>
        <p th:text="${message}"></p>
    </div>
    <div th:if="${sucmessage != null}" class="p-4 alert alert-success" role="alert">
        <i class="bi bi-card-checklist"></i>
        <p th:text="${sucmessage}"></p>
        Go to <a th:href="@{/}"><i class="bi bi-pencil-square"></i> Startpage</a> to continue
    </div>

    <div th:if="${statistic != null && statistic.isEmpty()}" class="container mt-5">
        <h2 class="mb-4">Aus der hochgeladenen Datei konnten keine Daten extrahiert werden. Bitte das Format prüfen,
            anpassen und nochmals versuchen.</h2>
    </div>

    <div th:if="${statistic != null && !statistic.isEmpty()}" class="container mt-5">
        <h2 class="mb-4">Prozessierungsergebnisse</h2>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>Kategorie</th>
                <th>Anzahl</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>Fehler:</td>
                <td th:text="${statistic.error}"></td>
            </tr>
            <tr>
                <td>Erfolge:</td>
                <td th:text="${statistic.entries}"></td>
            </tr>
            <tr>
                <td>Summe:</td>
                <td th:text="${statistic.count}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
        <div id="form-group">
            <div class="mb-3">
                <label for="selectedWorksheet">Tabellenname im Dokument:</label>
                <select class="form-select" name="selectedWorksheet" id="selectedWorksheet">
                    <option th:each="worksheet : ${worksheets}"
                            th:value="${worksheet}"
                            th:text="${worksheet}">}"
                        th:selected="${worksheet == selectedWorksheet}">
                    </option>
                </select>
            </div>
            <label for="file-upload">Dateiauswahl</label>
            <input type="file" class="classform-control-file" name="file" id="file-upload">
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
